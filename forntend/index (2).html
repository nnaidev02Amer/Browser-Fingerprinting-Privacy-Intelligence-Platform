<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Fingerprint Collector</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // Helper functions for fingerprinting
    function getCanvasFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(125, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('Hello, world!', 2, 15);
      return canvas.toDataURL();
    }

    function getWebGLFingerprint() {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return { vendor: 'N/A', renderer: 'N/A' };
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'N/A';
      const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'N/A';
      return { vendor, renderer };
    }

    function getAudioFingerprint() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return {
          sampleRate: audioCtx.sampleRate,
          baseLatency: audioCtx.baseLatency || 'N/A',
        };
      } catch {
        return { sampleRate: 'N/A', baseLatency: 'N/A' };
      }
    }

    function getAvailableFonts() {
      const fonts = ['Arial', 'Courier', 'Georgia', 'Impact', 'Times New Roman', 'Verdana'];
      const availableFonts = [];
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = '12px serif';
      const baseWidth = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
      fonts.forEach(font => {
        ctx.font = `12px "${font}"`;
        const width = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
        if (width !== baseWidth) availableFonts.push(font);
      });
      return availableFonts;
    }

    function getPlugins() {
      return Array.from(navigator.plugins).map(p => p.name);
    }

    async function getBatteryStatus() {
      if (!navigator.getBattery) return 'N/A';
      const battery = await navigator.getBattery();
      return {
        level: battery.level,
        charging: battery.charging,
        chargingTime: battery.chargingTime,
        dischargingTime: battery.dischargingTime,
      };
    }

    async function generateHash(data) {
      const jsonString = JSON.stringify(data);
      const encoder = new TextEncoder();
      const dataBuffer = encoder.encode(jsonString);
      const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // React Component
    const FingerprintCollector = () => {
      const [fingerprint, setFingerprint] = React.useState(null);

      const collectFingerprint = async () => {
        const userAgent = navigator.userAgent;
        const screenResolution = `${window.screen.width}x${window.screen.height}`;
        const colorDepth = window.screen.colorDepth;
        const availableFonts = getAvailableFonts();
        const plugins = getPlugins();
        const canvasFingerprint = getCanvasFingerprint();
        const webGLFingerprint = getWebGLFingerprint();
        const audioFingerprint = getAudioFingerprint();
        const batteryStatus = await getBatteryStatus();
        const deviceMemory = navigator.deviceMemory || 'N/A';
        const hardwareConcurrency = navigator.hardwareConcurrency || 'N/A';
        const touchSupport = navigator.maxTouchPoints > 0 ? 'Yes' : 'No';
        const language = navigator.language;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const cookiesEnabled = navigator.cookieEnabled;
        const doNotTrack = navigator.doNotTrack || 'N/A';

        const data = {
          userAgent,
          screenResolution,
          colorDepth,
          availableFonts,
          plugins,
          canvasFingerprint,
          webGLFingerprint,
          audioFingerprint,
          batteryStatus,
          deviceMemory,
          hardwareConcurrency,
          touchSupport,
          language,
          timezone,
          cookiesEnabled,
          doNotTrack,
        };

        const hash = await generateHash(data);
        data.hash = hash;
        setFingerprint(data);
      };

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg shadow-lg p-6 w-full max-w-2xl">
            <h1 className="text-2xl font-bold mb-4 text-center">Browser Fingerprint Collector</h1>
            <button
              onClick={collectFingerprint}
              className="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 mb-4"
            >
              Collect Fingerprint
            </button>
            {fingerprint && (
              <div className="space-y-4">
                <h2 className="text-xl font-semibold">Your Browser Fingerprint</h2>
                <p><strong>Hash:</strong> <span className="break-all">{fingerprint.hash}</span></p>
                <h3 className="text-lg font-medium">Browser Information</h3>
                <p><strong>User Agent:</strong> {fingerprint.userAgent}</p>
                <p><strong>Language:</strong> {fingerprint.language}</p>
                <p><strong>Timezone:</strong> {fingerprint.timezone}</p>
                <p><strong>Cookies Enabled:</strong> {fingerprint.cookiesEnabled ? 'Yes' : 'No'}</p>
                <p><strong>Do Not Track:</strong> {fingerprint.doNotTrack}</p>
                <h3 className="text-lg font-medium">Device Information</h3>
                <p><strong>Screen Resolution:</strong> {fingerprint.screenResolution}</p>
                <p><strong>Color Depth:</strong> {fingerprint.colorDepth}</p>
                <p><strong>Device Memory:</strong> {fingerprint.deviceMemory} GB</p>
                <p><strong>Hardware Concurrency:</strong> {fingerprint.hardwareConcurrency}</p>
                <p><strong>Touch Support:</strong> {fingerprint.touchSupport}</p>
                <h3 className="text-lg font-medium">Fingerprints</h3>
                <p><strong>Canvas Fingerprint:</strong> <span className="break-all">{fingerprint.canvasFingerprint}</span></p>
                <p><strong>WebGL Vendor:</strong> {fingerprint.webGLFingerprint.vendor}</p>
                <p><strong>WebGL Renderer:</strong> {fingerprint.webGLFingerprint.renderer}</p>
                <p><strong>Audio Sample Rate:</strong> {fingerprint.audioFingerprint.sampleRate}</p>
                <p><strong>Audio Base Latency:</strong> {fingerprint.audioFingerprint.baseLatency}</p>
                <h3 className="text-lg font-medium">Other Information</h3>
                <p><strong>Available Fonts:</strong> {fingerprint.availableFonts.join(', ')}</p>
                <p><strong>Plugins:</strong> {fingerprint.plugins.join(', ')}</p>
                <p><strong>Battery Status:</strong> {JSON.stringify(fingerprint.batteryStatus)}</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Render the component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FingerprintCollector />);
  </script>
</body>
</html>
